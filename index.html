      if(m===l)px=-(l+r);else if(m===rg)px=rg+r;else if(m===tp)py=-(tp+r);else py=bt+r;}
    else{px=dx/d*(r-d);py=dy/d*(r-d);}
    if(px>pxp)pxp=px;if(px<pxn)pxn=px;if(py>pyp)pyp=py;if(py<pyn)pyn=py;}

function pointInVeh(v,x,y,m){const dx=x-v.x,dy=y-v.y,ca=Math.cos(v.a),sa=Math.sin(v.a);

function vehPhys(v,dt){const t=v.t;let ca=Math.cos(v.a),sa=Math.sin(v.a);
  let vf=v.vx*ca+v.vy*sa,vr=-v.vx*sa+v.vy*ca;
  const thr=(v.dead||v.sink)?0:v.thr,str=(v.dead||v.sink)?0:v.str;
  if(thr>0){if(vf<0)vf+=t.acc*2.2*thr*dt;else vf+=t.acc*thr*dt*(1-0.55*vf/t.max);}
  else if(thr<0){if(vf>12)vf+=t.acc*2.4*thr*dt;else vf+=t.acc*0.75*thr*dt;}
  else vf-=Math.sign(vf)*Math.min(Math.abs(vf),(t.boat?40:70+Math.abs(vf)*0.35)*dt);
  vf=clamp(vf,-t.max*0.4,t.max*(v.hp<t.hp*0.5&&!t.tank?0.72+0.56*v.hp/t.hp:1));
  if(t.plane)planePhys(v,dt,vf);
  if(v.hb&&!t.boat)vf-=Math.sign(vf)*Math.min(Math.abs(vf),240*dt);
  const grip=t.grip*(v.hb?0.22:1)*(t.boat?1:1-0.42*ENV.wet);v.sm=lerp(v.sm||0,str,Math.min(1,dt*9));vr*=Math.max(0,1-grip*dt);
  const sp=Math.abs(vf),tf=clamp(vf/110,-1,1)*(1-clamp((sp-t.max*0.6)/t.max,0,0.3));
  v.a+=(v.sm*t.turn*(v.hb?1.4:1)+(v.pull||0))*tf*dt;
  if(v.driver===G.player)G.skidNow=!t.boat&&(Math.abs(vr)>105||(v.hb&&Math.abs(vf)>90));
  ca=Math.cos(v.a);sa=Math.sin(v.a);
  v.vx=ca*vf-sa*vr;v.vy=sa*vf+ca*vr;v.speed=vf;v.slide=vr;
  moveVeh(v,dt);
  if(!t.boat&&!v.sunk&&!(v.alt>0.25)&&tileAt(v.x,v.y)===TL.WATER){
    if(!v.sink){v.sink=0.001;splash(v.x,v.y,18);sfx.splash();}
  }
  if(v.sink){v.sink+=dt;v.vx*=0.92;v.vy*=0.92;if(v.sink>1.3)sinkVeh(v);}
  // skid marks
  if(!t.boat&&Math.abs(vr)>130&&!v.sink&&G.decals.length<600&&v.onScreen){const bx=v.x-ca*t.l*0.35,by=v.y-sa*t.l*0.35;
    G.decals.push({t:'skid',x:bx-sa*t.w*0.35,y:by+ca*t.w*0.35,a:v.a},{t:'skid',x:bx+sa*t.w*0.35,y:by-ca*t.w*0.35,a:v.a});}
  if(t.boat&&Math.abs(vf)>60&&rand()<0.7)part('wake',v.x-ca*t.l*0.5+rr(-6,6),v.y-sa*t.l*0.5+rr(-6,6),0,0,0.9,rr(5,9));
}
function moveVeh(v,dt){if(v.alt>0.25){v.x=clamp(v.x+v.vx*dt,T,(MW-1)*T);v.y=clamp(v.y+v.vy*dt,T,(MH-1)*T);return;}
 const sp=hyp(v.vx,v.vy),n=Math.max(1,Math.ceil(sp*dt/12)),sdt=dt/n;
  for(let k=0;k<n;k++){v.x+=v.vx*sdt;v.y+=v.vy*sdt;let px=0,py=0,hit=false;
    for(const c of vehCircles(v)){const p=circlePush(c[0],c[1],c[2],tt=>solidFor(v,tt));if(p){px+=p[0];py+=p[1];hit=true;}}
    if(hit){v.x+=px;v.y+=py;const l=hyp(px,py)||1,nx=px/l,ny=py/l,vn=v.vx*nx+v.vy*ny;
      if(vn<0){v.vx-=1.25*vn*nx;v.vy-=1.25*vn*ny;v.vx*=0.86;v.vy*=0.86;const imp=-vn;
        if(imp>110){damageVeh(v,(imp-110)*0.09,null);addDentDir(v,-nx,-ny,imp-90);if(v.driver===G.player)sfx.crash(imp);if(imp>160)part('spark',v.x-nx*v.t.w*0.5,v.y-ny*v.t.w*0.5,rr(-60,60),rr(-60,60),0.3,3);}}}}
}
function sinkVeh(v){v.sunk=true;v.remove=true;if(v.driver===G.player||v===G.player.lastVeh)G.stats.sunk++;splash(v.x,v.y,24);
  if(v.driver===G.player){const P=G.player;P.veh=null;P.x=v.x;P.y=v.y;v.driver=null;}
  else if(v.driver&&v.driver!==G.player){const p=mkPed(v.driver==='cop'?'cop':'civ',v.x,v.y);p.st='flee';p.ft=3;p.fx=v.x-10;p.fy=v.y;}}
function damageVeh(v,d,src){if(v.dead||d<=0)return;v.hp-=d;
  if(src===G.player&&v.t.police&&!v.dead)crime(1,true);
  if(v.hp<=0){v.hp=0;explodeVeh(v,src);}}
function explodeVeh(v,src){v.dead=true;v.burn=7;v.col='#2b2b2b';
  const d=v.driver;v.driver=null;v.ai=null;
  if(d===G.player){G.player.veh=null;G.player.x=v.x;G.player.y=v.y;killPed(G.player,src,'boom');}
  explodeAt(v.x,v.y,src,v);}
function explodeAt(x,y,src,skip){sfx.boom();G.shake=Math.max(G.shake||0,14);G.boom={x,y,t:1};
  for(const p of G.peds)if(p.type==='civ'&&!p.dead&&hyp(p.x-x,p.y-y)<520){p.st='flee';p.ft=6;p.fx=x;p.fy=y;}react(nearestCiv(x,y,520),'boom');post('boom');
  for(let i=0;i<26;i++)part('fire',x+rr(-18,18),y+rr(-18,18),rr(-140,140),rr(-140,140),rr(0.4,0.9),rr(8,16));
  for(let i=0;i<14;i++)part('smoke',x+rr(-20,20),y+rr(-20,20),rr(-40,40),rr(-40,40),rr(1,2),rr(12,22));
  G.decals.push({t:'scorch',x,y,r:rr(36,48)});
  for(const p of G.peds){if(p.dead||p.veh)continue;const d=hyp(p.x-x,p.y-y);if(d<100)hurtPed(p,110*(1-d/140),src,'boom');}
  for(const o of G.vehicles){if(o===skip||o.dead||o.sunk)continue;const d=hyp(o.x-x,o.y-y);if(d<120){damageVeh(o,60*(1-d/160),src);const k=(120-d)*3;o.vx+=(o.x-x)/(d||1)*k;o.vy+=(o.y-y)/(d||1)*k;}}
  const P=G.player;if(P.veh===null&&!P.dead){}
}

function movePed(p,dx,dy){const r=9;
  p.x+=dx;let c=circlePush(p.x,p.y,r,solidPed);if(c){p.x+=c[0];p.y+=c[1];}
  p.y+=dy;c=circlePush(p.x,p.y,r,solidPed);if(c){p.x+=c[0];p.y+=c[1];}
  p.swim=tileAt(p.x,p.y)===TL.WATER;}
function hurtPed(p,d,src,how){if(p.dead||d<=0)return;if(p===G.player&&G.armor>0&&how!=='drown'){const ab=Math.min(G.armor,d*0.8);G.armor-=ab;d-=ab;}p.hp-=d;if(p===G.player)G.lastHurt=G.time;else if(how==='punch'&&p.hp>0)p.stag=p.type==='cop'?0.7:0.28;
  if(G.decals.length<600&&how!=='drown'&&how!=='burn')part('blood',p.x,p.y,rr(-40,40),rr(-40,40),0.4,3);
  if(p!==G.player){
    if(p.type==='civ'||(!p.hostile&&p.type!=='npc')){p.st='flee';p.ft=6;p.fx=src?src.x:p.x-1;p.fy=src?src.y:p.y;}
    if(src===G.player){
      {const K=KINDS[p.kind]||{};if(p.type==='civ'&&how==='punch'&&p.hp>0&&!(p.brawl>0)&&!K.meek&&(K.tough||p.id%2===0)){p.brawl=10;react(p,'fight');}}
      if(p.type==='gang'){p.hostile=true;for(const o of G.peds)if(o.type==='gang'&&o.faction===p.faction&&!o.dead&&hyp(o.x-p.x,o.y-p.y)<500)o.hostile=true;}
      if(p.type==='soldier')p.hostile=true;
      if(p.type==='cop')crime(1,true);else crime(1,false);}}
  if(p.hp<=0)killPed(p,src,how);}
function killPed(p,src,how){if(p.dead)return;p.dead=true;p.hp=0;p.st='dead';
  if(how!=='drown'&&G.decals.length<600)G.decals.push({t:'blood',x:p.x+rr(-4,4),y:p.y+rr(-4,4),r:rr(9,15)});
  if(p===G.player){wasted();return;}
  if(src===G.player&&p.type==='cop')crime(2,true);else if(src===G.player&&p.type==='civ')crime(2,false);
  if(rand()<0.35&&!p.swim)mkPickup('cash',p.x+rr(-8,8),p.y+rr(-8,8),{amt:ri(5,45)});}

function fire(op,ov,x,y,ang,dmg,spread,expl,o){o=o||{};const a=ang+rr(-spread,spread),spd=o.spd||(expl?700:950);
  G.bullets.push({x:x+Math.cos(a)*18,y:y+Math.sin(a)*18,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:o.life||(expl?0.9:0.55),op,ov,dmg,expl,kind:o.kind,h:op===G.player&&G.player.roof?G.player.roof.ht:0});
  if(o.kind==='flame')return;
  if(o.kind!=='nade')part('flash',x+Math.cos(a)*20,y+Math.sin(a)*20,0,0,0.06,expl?14:7);
  if(!o.quiet&&(op===G.player||hyp(x-G.player.x,y-G.player.y)<700))sfx.shot(expl);
  if(!o.quiet){for(const p of G.peds)if(p.type==='civ'&&!p.dead&&hyp(p.x-x,p.y-y)<380){if(p.st==='call'||p.brawl>0)continue;if(p.id%4===1){p.st='cower';p.ft=4;}else{p.st='flee';p.ft=5;p.fx=x;p.fy=y;}}
    if(op===G.player){const nc=nearestCiv(x,y,380);if(nc&&G.sayCD<=0)sfx.scream(dv(nc.x,nc.y),nc.voice||200);react(nc,'shots');}}}
function updateBullets(dt){for(const b of G.bullets){const steps=Math.max(1,Math.ceil(hyp(b.vx,b.vy)*dt/10)),sdt=dt/steps;
  if(b.kind==='flame')part('fire',b.x+rr(-4,4),b.y+rr(-4,4),b.vx*0.1,b.vy*0.1,0.22,rr(5,10));
  for(let k=0;k<steps&&!b.dead;k++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;const tt=tileAt(b.x,b.y);
    if(heliHit(b)||gatorHit(b)){b.dead=true;break;}
    if((tt===TL.BLD&&!(b.h&&bAt(b.x,b.y).ht<=b.h+0.2))||tt===TL.FENCE){b.dead=true;if(b.kind!=='flame')part('spark',b.x,b.y,rr(-50,50),rr(-50,50),0.2,2);if(b.expl)explodeAt(b.x,b.y,b.op);break;}
    for(const p of G.peds){if(p.dead||p.veh||p===b.op)continue;if((p.x-b.x)**2+(p.y-b.y)**2<130){hurtPed(p,b.dmg,b.op,'shot');if(b.kind==='flame')p.burn=3;b.dead=true;if(b.expl)explodeAt(b.x,b.y,b.op);break;}}
    if(b.dead)break;
    for(const v of G.vehicles){if(v===b.ov||v.sunk||v.alt>0.25)continue;if(pointInVeh(v,b.x,b.y,2)){if(!b.expl&&b.kind!=='flame')addHole(v,b.x,b.y);damageVeh(v,b.dmg*(b.expl?3:0.45),b.op);b.dead=true;part('spark',b.x,b.y,rr(-60,60),rr(-60,60),0.25,2);
      if(b.expl)explodeAt(b.x,b.y,b.op,v);break;}}}
  b.life-=dt;if(b.life<=0){b.dead=true;if(b.expl)explodeAt(b.x,b.y,b.op);}}
  G.bullets=G.bullets.filter(b=>!b.dead);}

function part(type,x,y,vx,vy,life,size){if(G.parts.length>450)return;G.parts.push({type,x,y,vx,vy,life,max:life,size});}
function splash(x,y,n){for(let i=0;i<n;i++)part('splash',x+rr(-14,14),y+rr(-14,14),rr(-90,90),rr(-90,90),rr(0.4,0.8),rr(3,6));}
function updateParts(dt){for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;
  if(p.type==='smoke'||p.type==='wake'||p.type==='steam')p.size+=dt*10;}
  G.parts=G.parts.filter(p=>p.life>0);
  if(G.decals.length>600)G.decals.splice(0,G.decals.length-600);}

function mkPickup(type,x,y,o){const p=Object.assign({type,x,y,t:rand()*6,id:++UID},o||{});G.pickups.push(p);return p;}
function giveWeapon(w,ammo){G.weapons[w]=(G.weapons[w]||0)+ammo;if(G.weapon==='fist')G.weapon=w;}

function copSees(r){const P=G.player,px=P.x,py=P.y;
  for(const p of G.peds)if(p.type==='cop'&&!p.dead&&(p.x-px)**2+(p.y-py)**2<r*r)return true;
  for(const v of G.vehicles)if(v.t.police&&!v.dead&&v.driver==='cop'&&(v.x-px)**2+(v.y-py)**2<r*r)return true;
  return false;}
function crime(n,always){if(G.state!=='play')return;if(G.time-G.lastCrime<1.1)return;
  if(!always&&!copVisible()){plusWitness();return;}G.lastCrime=G.time;addHeat((always?1.5:0.7)*n);const P=G.player;G.lastSeen={x:P.x,y:P.y};G.seenVeh=P.veh?P.veh.id:0;G.seenOut=G.outfit;}
function los(x1,y1,x2,y2){const d=hyp(x2-x1,y2-y1),n=Math.ceil(d/24);for(let i=1;i<n;i++){const t=tileAt(x1+(x2-x1)*i/n,y1+(y2-y1)*i/n);if(t===TL.BLD||t===TL.FENCE)return false;}return true;}
function onScreen(x,y,m){const c=G.cam,hw=G.vw/2/c.s+m,hh=G.vh/2/c.s+m;return Math.abs(x-c.x)<hw&&Math.abs(y-c.y)<hh;}

// ---------- traffic ----------
function trafficAt(v,i,j,d,frac){const ni=i+DIRS[d][0],nj=j+DIRS[d][1];const a=exitPt(i,j,d),b=entryPt(ni,nj,d);
  v.x=lerp(a.x,b.x,frac);v.y=lerp(a.y,b.y,frac);v.a=d*Math.PI/2;
  v.ai={mode:'traffic',node:[ni,nj],d,wps:[b],blocked:0,stuck:0,rev:0,cruise:(v.t.bus?150:v.t.bike?230:190)+rr(-20,20)};}
function trafficFromHere(v){const [i,j]=nearestNode(v.x,v.y);let d=Math.round(((v.a%TAU)+TAU)%TAU/(Math.PI/2))%4;
  if(!validDir(i,j,d))d=[0,1,2,3].find(k=>validDir(i,j,k));
  v.ai={mode:'traffic',node:[i,j],d,wps:[entryPt(i,j,d)],blocked:0,stuck:0,rev:0,cruise:180};}
function pickDir(i,j,d){const opts=[];for(let k=0;k<4;k++){if(k===(d+2)%4||!validDir(i,j,k))continue;opts.push(k);if(k===d){opts.push(k);opts.push(k);}}return opts.length?pick(opts):(d+2)%4;}
function aiTraffic(v,dt){const ai=v.ai;if(!ai.wps.length){trafficFromHere(v);return;}
  let wp=ai.wps[0];const nk=ai.node[0]*100+ai.node[1];
  if(ai.nx==null||ai.nxN!==nk){ai.nx=pickDir(ai.node[0],ai.node[1],ai.d);ai.nxN=nk;}
  if(hyp(wp.x-v.x,wp.y-v.y)<30){ai.wps.shift();
    if(!ai.wps.length){const [i,j]=ai.node,nd=validDir(i,j,ai.nx)&&ai.nx!==(ai.d+2)%4?ai.nx:pickDir(i,j,ai.d);ai.wps.push(exitPt(i,j,nd));const ni=i+DIRS[nd][0],nj=j+DIRS[nd][1];ai.wps.push(entryPt(ni,nj,nd));ai.node=[ni,nj];ai.d=nd;v.blinkT=1.2;}
    wp=ai.wps[0];}
  {const tn=(ai.nx-ai.d+4)%4;if(ai.wps.length===1&&(tn===1||tn===3)&&hyp(wp.x-v.x,wp.y-v.y)<340)v.blink=tn===1?1:-1;else if(v.blinkT>0)v.blinkT-=dt;else v.blink=0;}
  const want=Math.atan2(wp.y-v.y,wp.x-v.x),diff=angDiff(v.a,want);
  if(ai.rev>0){ai.rev-=dt;v.thr=-0.7;v.str=-Math.sign(diff);v.hb=0;return;}
  v.str=clamp(diff*2.6,-1,1);
  const target=Math.abs(diff)>0.35?100:ai.cruise;
  const blk=lookAhead(v);let red=false;
  if(ai.wps.length===1){const dd=hyp(wp.x-v.x,wp.y-v.y);if(dd<125&&dd>10){const st=lightState(ai.node[0],ai.node[1])[ai.d%2];red=st==='r'||(st==='y'&&dd>60);}}
  if(red){v.thr=v.speed>8?-1:0;ai.blocked=0;ai.stuck=0;}
  else if(blk){v.thr=v.speed>8?-1:0;ai.blocked+=dt;if(blk===G.player||blk===G.player.veh){if(ai.blocked>1.1&&(ai.hornT=(ai.hornT||0)-dt)<=0&&v.onScreen){ai.hornT=rr(1.2,2.8);sfx.horn(v,dv(v.x,v.y));}}}
  else{ai.blocked=0;v.thr=v.speed<target?1:(v.speed>target+40?-0.4:0);}
  v.hb=0;
  if(Math.abs(v.speed)<6&&!blk&&v.thr>0)ai.stuck+=dt;else ai.stuck=0;
  if(ai.stuck>1.5){ai.stuck=0;ai.rev=0.9;}
  if(ai.blocked>14&&!v.onScreen)v.remove=true;}
function lookAhead(v){const ca=Math.cos(v.a),sa=Math.sin(v.a),reach=55+Math.max(0,v.speed)*0.55;
  const test=(o,hw)=>{const dx=o.x-v.x,dy=o.y-v.y;const al=dx*ca+dy*sa;if(al<v.t.l*0.4||al>reach+v.t.l*0.5)return false;return Math.abs(-dx*sa+dy*ca)<hw;};
  for(const o of G.vehicles)if(o!==v&&!o.sunk&&!o.t.boat&&test(o,26))return o;
  const P=G.player;if(!P.veh&&!P.dead&&test(P,22))return P;
  for(const p of G.peds)if(!p.dead&&!p.veh&&p!==P&&test(p,18))return p;
  return null;}

// ---------- chasing (police / gangs) ----------
function nextNodeToward(x,y,tx,ty){const [i,j]=nearestNode(x,y);const np=nodePos(i,j);
  if(hyp(np.x-x,np.y-y)>150)return np;let best=null,bd=1e9;
  for(let d=0;d<4;d++){if(!validDir(i,j,d))continue;const p=nodePos(i+DIRS[d][0],j+DIRS[d][1]);const dd=hyp(p.x-tx,p.y-ty);if(dd<bd){bd=dd;best=p;}}
  return best||np;}
function chaseDrive(v,tx,ty,dt){const ai=v.ai,d=hyp(tx-v.x,ty-v.y);let gx,gy;
  if(d<420&&los(v.x,v.y,tx,ty)){gx=tx;gy=ty;ai.wp=null;}
  else{if(!ai.wp||hyp(ai.wp.x-v.x,ai.wp.y-v.y)<80)ai.wp=nextNodeToward(v.x,v.y,tx,ty);gx=ai.wp.x;gy=ai.wp.y;}
  if(ai.rev>0){ai.rev-=dt;v.thr=-1;v.str=ai.revDir;v.hb=0;return d;}
  let diff=angDiff(v.a,Math.atan2(gy-v.y,gx-v.x));
  const look=46+Math.abs(v.speed)*0.32,ca=Math.cos(v.a),sa=Math.sin(v.a);
  if(solidFor(v,tileAt(v.x+ca*look,v.y+sa*look))){
    const l=solidFor(v,tileAt(v.x+Math.cos(v.a-0.7)*look,v.y+Math.sin(v.a-0.7)*look)),r=solidFor(v,tileAt(v.x+Math.cos(v.a+0.7)*look,v.y+Math.sin(v.a+0.7)*look));
    if(!l&&r)diff=-1.2;else if(l&&!r)diff=1.2;}
  v.str=clamp(diff*2.6,-1,1);v.thr=Math.abs(diff)>1.5?0.45:1;v.hb=Math.abs(diff)>1.1&&v.speed>200?1:0;
  if(Math.abs(v.speed)<22)ai.stuck+=dt;else ai.stuck=Math.max(0,ai.stuck-dt);
  if(ai.stuck>1.1){ai.stuck=0;ai.rev=0.85;ai.revDir=-(Math.sign(diff)||1);}
  return d;}
function aiChase(v,dt){const ai=v.ai,P=G.player,tgt=P.veh||P,law=ai.faction==='police'||ai.faction==='army';
  if(P.dead){v.thr=0;v.hb=1;return;}
  if(law&&!v.mission&&G.wanted===0){trafficFromHere(v);v.driver='civ';if(v.t.police)v.driver='cop';return;}
  const seen=!law||v.mission||G.seenNow||!G.lastSeen;let tx=tgt.x,ty=tgt.y;
  if(!seen){const ls=G.lastSeen;if(ai.sp||hyp(v.x-ls.x,v.y-ls.y)<300){ai.spT=(ai.spT||0)-dt;
      if(!ai.sp||ai.spT<=0||hyp(v.x-ai.sp.x,v.y-ai.sp.y)<150){const [i,j]=nearestNode(ls.x,ls.y);ai.sp=nodePos(clamp(i+ri(-2,2),0,XS.length-1),clamp(j+ri(-2,2),0,YS.length-1));ai.spT=7;}
      tx=ai.sp.x;ty=ai.sp.y;}else{tx=ls.x;ty=ls.y;}}
  else ai.sp=null;

function nextMission(){return MISSIONS.find(m=>!G.done.includes(m.id));}
function startMission(m){G.mission={m,step:-1,key:{},timer:null,target:null,ents:[]};nextStep();}
function nextStep(){const M=G.mission;if(!M)return;M.step++;const s=M.m.steps[M.step];M.s=s;if(!s)return;
  M.timer=s.timer!=null?s.timer:null;M.target=null;
  switch(s.t){
  case'talk':setObj('');if(G.player.veh){G.player.veh.vx=0;G.player.veh.vy=0;}showDialog(s.lines,()=>nextStep());break;
  case'getveh':{let v=M.key[s.key];if(!v){const p=POI[s.at];v=mkVeh(s.type,p.x,p.y,p.a||0,s.col);v.persist=true;v.mission=true;v.fuel=1;M.key[s.key]=v;}M.target=v;setObj(L(s.obj));break;}
  case'goto':{const p=POI[s.at];M.target={x:p.x,y:p.y,r:s.r};setObj(L(s.obj));break;}
  case'wanted':setStars(s.n);if(s.toast)toast(L(s.toast));nextStep();break;
  case'hostiles':for(let k=0;k<s.n;k++){const v=spawnChaser(s.faction,s.type,s.col,500,1100);if(v){v.persist=true;v.mission=true;M.ents.push(v);}}nextStep();break;
  case'collect':M.need=POI.crates.length;M.got=0;M.crates=POI.crates.map(c=>mkPickup('crate',c.x,c.y,{alarm:c.alarm,mission:1}));setObj(fmt(tr('crates'),0,M.need));break;
  case'reward':passMission(s);break;
  default:stepStart(M,s);}}
function updateMission(dt){const M=G.mission;
  if(!M){const nm=nextMission();const P=G.player;
    if(nm&&!P.veh&&!P.dead&&hyp(P.x-nm.start.x,P.y-nm.start.y)<36){startMission(nm);return;}
    if(!P.veh&&!P.dead)for(const sm of sideAvail())if(hyp(P.x-sm.start.x,P.y-sm.start.y)<36){startMission(sm);return;}
    setObj(G.fare?tr('fareObj'):nm?L(nm.hint):tr('free'));return;}
  const s=M.s;if(!s||s.t==='talk')return;
  if(M.timer!=null){M.timer-=dt;if(M.timer<=0){failMission('f_time');return;}}
  for(const k in M.key){const v=M.key[k];if(v.dead||v.sunk){failMission('f_veh');return;}}
  const P=G.player;const px=P.veh?P.veh.x:P.x,py=P.veh?P.veh.y:P.y;
  if(stepUpdate(M,s,dt,P,px,py))return;
  if(s.t==='getveh'){if(P.veh===M.key[s.key])nextStep();return;}
  if(s.t==='goto'){const p=POI[s.at];
    if(s.inVeh){const v=M.key[s.inVeh];
      if(s.minHp&&v.hp/v.t.hp<s.minHp){failMission('f_dmg');return;}
      if(P.veh!==v){setObj(fmt(tr('getback'),vehName(v)));M.target=v;return;}
      setObj(L(s.obj));M.target={x:p.x,y:p.y,r:s.r};}
    if(hyp(px-p.x,py-p.y)<s.r){if(P.veh){P.veh.vx*=0.2;P.veh.vy*=0.2;}nextStep();}return;}
  if(s.t==='collect'){const left=M.crates.filter(c=>!c.taken);
    if(!left.length){nextStep();return;}
    let best=null,bd=1e9;for(const c of left){const d=hyp(c.x-px,c.y-py);if(d<bd){bd=d;best=c;}}M.target={x:best.x,y:best.y,r:40};
    setObj(fmt(tr('crates'),M.need-left.length,M.need));}}
function passMission(s){const M=G.mission;G.money+=s.money||0;
  if(s.weapon){giveWeapon(s.weapon[0],s.weapon[1]);setTimeout(()=>toast(fmt(tr('newweap'),L(WEAP[s.weapon[0]]))),1600);}
  G.done.push(M.m.id);if(s.fn)s.fn();if(s.endMsg)setTimeout(()=>toast(L(s.endMsg),8),3500);cleanupMission();bigMsg(tr('passed'),'#5dff7a',fmt(tr('reward'),s.money||0));sfx.pass();saveGame();
  if(s.end)setTimeout(()=>toast(tr('chapend'),7),3500);}
function failMission(reason){const M=G.mission;if(!M)return;cleanupMission();
  if(G.state==='play'||G.state==='dialog'){bigMsg(tr('failed'),'#ff5050',tr(reason));sfx.fail();}}
function cleanupMission(){const M=G.mission;if(!M)return;
  for(const k in M.key){M.key[k].persist=false;M.key[k].mission=false;}
  for(const v of M.ents){v.persist=false;v.mission=false;}
  for(const p of G.peds)if(p.mission){p.hostile=false;p.mission=false;}
  G.pickups=G.pickups.filter(p=>!p.mission);G.mission=null;G.dialog=null;if(G.state==='dialog')G.state='play';hideDialog();}

// ---------- dialog ----------
function showDialog(lines,cb){G.dialog={lines,i:0,ch:0,cb};G.state='dialog';renderDialog();}
function advanceDialog(){const D=G.dialog;if(!D)return;const line=D.lines[D.i],full=L(line);
  if(D.ch<full.length){D.ch=full.length;renderDialog();return;}
  D.i++;D.ch=0;if(D.i>=D.lines.length){G.dialog=null;G.state='play';hideDialog();D.cb&&D.cb();return;}renderDialog();}
function updateDialog(dt){const D=G.dialog;if(!D)return;const full=L(D.lines[D.i]);if(D.ch<full.length){const before=Math.floor(D.ch);D.ch=Math.min(full.length,D.ch+dt*42);
  if(Math.floor(D.ch)!==before&&Math.floor(D.ch)%3===0)sfx.chat(SPK[D.lines[D.i].who].p);renderDialog();}}

const LADS=[],JT=0.5;
const R2=(he,en)=>({he,en});
const REACT={bump:[R2('היי! תיזהר!','Hey! Watch it!'),R2('מה הבעיה שלך?','What is your problem?')],shots:[R2('יריות! רוצו!','Shots! Run!'),R2('אלוהים אדירים!','Oh my god!')],

function say(p,key,dur){if(!p)return;p.say=L(pick(REACT[key]));p.sayT=dur||2.2;}
function react(p,key){if(!p||G.sayCD>0)return;G.sayCD=0.9;say(p,key);if(p.kind==='dog')sfx.bark(dv(p.x,p.y));else sfx.voice(p,dv(p.x,p.y));}
function nearestCiv(x,y,r){let b=null,bd=r;for(const p of G.peds){if(p.type!=='civ'||p.dead)continue;const d=hyp(p.x-x,p.y-y);if(d<bd){bd=d;b=p;}}return b;}
function bAt(x,y){return BUILDINGS[BMAP[Math.floor(y/T)*MW+Math.floor(x/T)]];}

function addLadder(b,side,pos){const x0=b.x*T,y0=b.y*T,x1=(b.x+b.w)*T,y1=(b.y+b.h)*T;let l;
  if(side===2)l={gx:pos,gy:y1+15,rx:pos,ry:y1-17,wx:pos,wy:y1};else if(side===0)l={gx:pos,gy:y0-15,rx:pos,ry:y0+17,wx:pos,wy:y0};
  else if(side===1)l={gx:x1+15,gy:pos,rx:x1-17,ry:pos,wx:x1,wy:pos};else l={gx:x0-15,gy:pos,rx:x0+17,ry:pos,wx:x0,wy:pos};
  l.b=b;l.side=side;LADS.push(l);(b.lads||(b.lads=[])).push(l);}
function genLadders(){const ok=t=>t===TL.WALK||t===TL.CONC||t===TL.GRASS||t===TL.LOT||t===TL.SAND;
  for(const b of BUILDINGS){if(b.cont||b.army||b.hangar||b.court||b.lh||b.lads||b.shops||b.ht>2.8)continue;if(b.seed%3&&!b.lad)continue;
    const tries=[[2,b.x+(b.w>>1),b.y+b.h],[0,b.x+(b.w>>1),b.y-1],[1,b.x+b.w,b.y+(b.h>>1)],[3,b.x-1,b.y+(b.h>>1)]];
    for(const [s,tx,ty] of tries)if(ok(tget(tx,ty))){addLadder(b,s,(s%2===0?tx:ty)*T+T/2);break;}}
  const c=POI.court;addLadder(c.bs,2,c.x);addLadder(c.bs,0,c.x);
  let rn=0;const RT=['cash','token','armor','token','smg','cash','token','shotgun','health','token','grenade','cash'];
  for(const l of LADS){const b=l.b;if(b.court||b.w<2||b.h<2||b.rt)continue;if((rn++)%3)continue;b.rt=1;const ty=RT[(rn/3|0)%RT.length],x=(b.x+b.w/2)*T,y=(b.y+b.h/2)*T;
    if(ty==='token')TOKENS.push({id:TOKENS.length,x,y,h:b.ht});else WPICKS.push({type:ty,x,y,h:b.ht,amt:ty==='cash'?400:0,once:ty==='cash'?'c'+rn:null});}}

function playerH(){const P=G.player;if(P.climb){const c=P.climb;return c.l.b.ht*Math.min(1,c.up?c.t:1-c.t);}return(P.roof?P.roof.ht:0)+(P.jump>0?Math.sin(Math.PI*(1-P.jump/JT))*0.9:0);}
function pMove(P,dx,dy){if(P.inside){roomMove(P,dx,dy);return;}
 const base=P.roof?P.roof.ht:0,air=P.jump>0,lim=base+(air?0.95:0.45);
  const solid=(t,tx,ty)=>{if(t===TL.BLD){const b=BUILDINGS[BMAP[ty*MW+tx]];return air?b.ht>lim:(P.roof?Math.abs(b.ht-base)>0.45:true);}
    if(P.roof&&!air)return true;if(t===TL.FENCE)return !air;return false;};
  P.x+=dx;let c=circlePush(P.x,P.y,9,solid);if(c){P.x+=c[0];P.y+=c[1];}P.y+=dy;c=circlePush(P.x,P.y,9,solid);if(c){P.x+=c[0];P.y+=c[1];}
  if(P.roof&&!air&&tileAt(P.x,P.y)===TL.BLD){const b=bAt(P.x,P.y);if(b!==P.roof)P.roof=b;}}
function land(P){P.jump=0;G.jumpCD=0.12;const base=P.roof?P.roof.ht:0,t=tileAt(P.x,P.y),nb=t===TL.BLD?bAt(P.x,P.y):null,nh=nb?nb.ht:0;
  if(base-nh>1.4){G.stats.falls++;hurtPed(P,(base-nh-1)*9,null,'fall');G.hurtFlash=0.5;G.shake=5;if(base-nh>2)post('fall');}
  for(let k=0;k<8;k++)part('steam',P.x+rr(-6,6),P.y+rr(-6,6),rr(-70,70),rr(-70,70),0.45,rr(3,7));
  P.roof=nb;if(!nb&&t===TL.WATER){splash(P.x,P.y,10);sfx.splash();}else sfx.step();}
function plusFoot(P,dt,jp){if(G.jumpCD>0)G.jumpCD-=dt;
  if(P.climb){const c=P.climb,l=c.l;c.t+=dt/(0.35+l.b.ht*0.3);const t=Math.min(1,c.up?c.t:1-c.t);P.x=lerp(l.gx,l.rx,t);P.y=lerp(l.gy,l.ry,t);P.a=Math.atan2(l.ry-l.gy,l.rx-l.gx);P.walk+=dt*90;P.mvx=P.mvy=0;
    if(c.t>=1){P.roof=c.up?l.b:null;P.climb=null;}return true;}
  if(!(P.jump>0)&&!P.inside){let near=null;const onR=!!P.roof;for(const l of LADS){const ax=onR?l.rx:l.gx,ay=onR?l.ry:l.gy;if(hyp(P.x-ax,P.y-ay)>(onR?30:36))continue;near=l;
      const dx=onR?l.gx-l.rx:l.rx-l.gx,dy=onR?l.gy-l.ry:l.ry-l.gy,dl=hyp(dx,dy);if(((P.mvx||0)*dx+(P.mvy||0)*dy)/dl>45){P.ladT=(P.ladT||0)+dt;if(P.ladT>0.22){P.ladT=0;P.climb={l,t:0,up:!onR};G.nearLad=null;sfx.door();return true;}}else P.ladT=0;break;}
    if(near&&!G.seen.lad){G.seen.lad=1;toast(tr('ladHint'),5);}G.nearLad=near;}
  if(P.jump>0){P.jump-=dt;if(P.jump<=0)land(P);}
  else if(jp&&!P.swim&&G.jumpCD<=0){P.jump=JT;sfx.jump();for(let k=0;k<7;k++)part('steam',P.x+rr(-6,6),P.y+rr(-6,6),rr(-55,55),rr(-55,55),0.4,rr(3,6));}
  return false;}
function tryLadder(){const P=G.player;for(const l of LADS){if(P.roof){if(hyp(P.x-l.rx,P.y-l.ry)<40){P.climb={l,t:0,up:false};sfx.door();return true;}}
  else if(hyp(P.x-l.gx,P.y-l.gy)<60){P.climb={l,t:0,up:true};sfx.door();return true;}}return false;}

// ---------- vehicle damage ----------
function addDentDir(v,dx,dy,sev){if(sev<=0||v.t.tank||!(v.onScreen||v.driver===G.player))return;const t=v.t,Lh=t.l/2,Wh=t.w/2,ca=Math.cos(v.a),sa=Math.sin(v.a);
  const lx=clamp((dx*ca+dy*sa)*Lh*1.5,-Lh+3,Lh-3),ly=clamp((-dx*sa+dy*ca)*Wh*1.5,-Wh+3,Wh-3);

function stepStart(M,s){M.rings=null;M.target=null;switch(s.t){
  case'give':giveWeapon(s.weapon[0],s.weapon[1]);G.weapon=s.weapon[0];toast(fmt(tr('newweap'),L(WEAP[s.weapon[0]])));nextStep();break;
  case'away':setObj(L(s.obj));M.timer=s.fuse;break;
  case'lose':setObj(tr('lose'));break;
  case'cond':if(s.init)s.init(M);setObj(L(s.obj));break;
  case'kill':{const p0=POI[s.at];M.tg=[];for(let k=0;k<s.n;k++){let x,y,n=0;do{const a=rr(0,TAU),r=rr(30,s.rad||130);x=p0.x+Math.cos(a)*r;y=p0.y+Math.sin(a)*r;}while(++n<25&&!walkable(tileAt(x,y)));
      M.tg.push(mkPed(s.ptype||'soldier',x,y,{faction:s.faction,hostile:true,persist:true,mission:true}));}break;}
  case'destroy':{M.tg=[];const pts=typeof s.pts==='function'?s.pts():s.pts;for(const q of pts){const v=mkVeh(s.type,q[0]*T,q[1]*T,q[2]||0,s.col);v.persist=true;v.fuel=1;if(s.hp)v.hp=s.hp;M.tg.push(v);M.ents.push(v);
      if(s.move){v.driver='soldier';trafficFromHere(v);v.ai.cruise=s.move;}}break;}
  case'pick':{const pts=typeof s.pts==='function'?s.pts():s.pts;M.pts=pts.map(q=>({x:q[0],y:q[1],roof:q[2]||0,done:false}));break;}
  default:nextStep();}}
function stepUpdate(M,s,dt,P,px,py){const near=(list)=>{let b=list[0];for(const o of list)if(hyp(o.x-px,o.y-py)<hyp(b.x-px,b.y-py))b=o;return b;};
  switch(s.t){
  case'away':{const v=M.key[s.veh];if(!v){nextStep();return true;}if(hyp(px-v.x,py-v.y)>s.dist||M.timer<0.35){delete M.key[s.veh];v.persist=false;v.mission=false;explodeVeh(v,null);if(G.mission===M&&!P.dead)nextStep();}return true;}
  case'lose':if(G.wanted===0)nextStep();return true;
  case'cond':if(s.f(M))nextStep();return true;
  case'kill':{const al=M.tg.filter(p=>!p.dead);if(!al.length){nextStep();return true;}const b=near(al);M.target={x:b.x,y:b.y};M.rings=al.map(p=>({x:p.x,y:p.y,r:18,c:'#ff5050'}));setObj(fmt(L(s.obj),s.n-al.length,s.n));return true;}
  case'destroy':{const al=M.tg.filter(v=>!v.dead&&!v.sunk&&!v.remove);if(!al.length){nextStep();return true;}const b=near(al);M.target={x:b.x,y:b.y};M.rings=al.map(v=>({x:v.x,y:v.y,r:50,c:'#ff5050'}));setObj(fmt(L(s.obj),M.tg.length-al.length,M.tg.length));return true;}
  case'pick':{let left=[];for(const q of M.pts){if(q.done)continue;const d=hyp(q.x-px,q.y-py),ok=s.air?(P.veh&&P.veh.alt>0.5&&d<130):q.roof?(!!P.roof&&!P.veh&&d<52):d<(s.r||48);if(ok){q.done=true;sfx.blip();part('flash',q.x,q.y,0,0,0.2,20);}else left.push(q);}
    if(!left.length){nextStep();return true;}const b=near(left);M.target={x:b.x,y:b.y};M.rings=left.map(q=>({x:q.x,y:q.y,r:s.air?100:26,c:'#ffe14d',h:q.roof}));setObj(fmt(L(s.obj),M.pts.length-left.length,M.pts.length));return true;}}
  return false;}

function updatePlayer(dt){const P=G.player;if(P.dead)return;const [mx,my]=readKeys(),mag=Math.min(1,hyp(mx,my)),k=IN.keys;
  if(P.veh){const v=P.veh;P.x=v.x;P.y=v.y;G.nearLad=null;let fx=IN.x||k.KeyX;
    if(G.ctrl==='classic'){const kx=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0),sx=kx||(Math.abs(IN.mx)>0.15?clamp(IN.mx*1.35,-1,1):0);
      const gas=IN.act||k.KeyW||k.ArrowUp||IN.my<-0.6,brk=IN.b||k.KeyS||k.ArrowDown||IN.my>0.65;
      v.str=sx;v.thr=gas?1:brk?-1:0;v.hb=(IN.w||k.Space)?1:0;}
    else{const brake=IN.b||k.ShiftLeft||k.ShiftRight;fx=fx||IN.act||k.Space;
      if(mag>0.15){const want=Math.atan2(my,mx),diff=angDiff(v.a,want),ad=Math.abs(diff);
        if(v.rev?ad>1.3:ad>2.1&&v.speed<140){v.rev=true;const d2=angDiff(v.a,want+Math.PI);v.thr=-mag;v.str=clamp(-d2*2.4,-1,1);}
        else{v.rev=false;v.str=clamp(diff*2.4,-1,1);v.thr=mag*(ad>1.3?0.55:1);}}
      else{v.thr=0;v.str=0;v.rev=false;}
      v.hb=brake?1:0;if(brake&&mag<0.15)v.thr=v.speed>15?-1:0;}
    if(!v.t.boat&&!v.t.tank){v.fuel=Math.max(0,v.fuel-Math.abs(v.thr)*dt/260);if(v.fuel<=0){v.thr=0;if(!v.dry){v.dry=1;toast(tr('nofuel'),4);}}}
    if(fx&&G.fireCD<=0){if(v.t.tank){G.fireCD=1.1;fire(P,v,v.x,v.y,v.a,120,0.01,true);G.shake=6;crime(1,false);}
      else{G.fireCD=0.6;sfx.horn(v,1);react(nearestCiv(v.x,v.y,170),'horn');for(const p of G.peds)if(p.type==='civ'&&!p.dead&&hyp(p.x-v.x,p.y-v.y)<160){p.st='flee';p.ft=2;p.fx=v.x;p.fy=v.y;}}}
    if(IN.enterP)exitVehicle();

function startGame(fresh){AU.init();if(fresh)store.del('sb_save');const sv=store.get('sb_save',null);
  G.vehicles=[];G.peds=[];G.pickups=[];G.bullets=[];G.parts=[];G.decals=[];G.mission=null;G.wanted=0;G.seen={};
  G.money=sv?sv.money:0;G.done=sv?sv.done:[];G.tokens=sv?sv.tokens:[];G.weapons=sv?sv.weapons:{fist:1};G.weapon='fist';G.armor=sv&&sv.armor||0;G.got=sv&&sv.got||[];G.outfit=sv&&sv.outfit||'std';G.outfits=sv&&sv.outfits||['std'];G.meds=sv&&sv.meds||0;G.rep=sv&&sv.rep||0;G.heat=0;G.talk=null;G.shop=null;G.inShop=null;cityInit();G.way=sv&&sv.way||null;G.duckHorn=sv&&sv.duck||0;G.stats={falls:0,sunk:0,robs:0};G.rob=null;G.spot=null;G.nearLad=null;G.heli=null;G.fare=null;G.ev=null;G.bust=0;G.lastSeen=null;G.area=null;ENV.clock=sv&&sv.clock!=null?sv.clock:8;setWeather('clear',true);calcLight();
  const start=sv&&G.done.length?POI.safe:POI.start;
  G.player=mkPed('player',start.x,start.y);G.peds.pop();G.player.hp=100;G.player.a=-Math.PI/2;
  populateStatic();G.cam.x=G.player.x;G.cam.y=G.player.y;G.stamina=G.maxStam;
  $('menu').style.display='none';$('hud').style.display='block';$('controls').style.display='block';$('bPause').style.display='block';
  try{if(document.documentElement.requestFullscreen&&matchMedia('(pointer:coarse)').matches)document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
  G.state='play';G.obj=null;
  if(!sv||!G.done.length){if(!sv){showDialog(INTRO,()=>{toast(tr('help'),10);});}}
  saveGame();}

// ---------- loop ----------
function resize(){G.dpr=Math.min(G.lowFx?1.25:2,devicePixelRatio||1);applyLayout();CV.width=G.vw*G.dpr;CV.height=G.vh*G.dpr;CV.style.width=G.vw+'px';CV.style.height=G.vh+'px';
  const ms=Math.round(Math.min(130,Math.max(96,Math.min(G.vw,G.vh)/G.ui*0.28)));MC.style.width=MC.style.height=ms+'px';MC.width=MC.height=Math.round(ms*G.dpr*G.ui);document.getElementById('root').style.setProperty('--vw',G.vw+'px');document.documentElement.style.setProperty('--ms',ms+'px');}
function updateCamera(dt){const P=G.player,c=G.cam;let tx=P.x,ty=P.y,z=1;
  if(P.veh){const v=P.veh;tx+=v.vx*0.35;ty+=v.vy*0.35;z=lerp(1,0.6,clamp(Math.abs(v.speed)/420,0,1));if(v.alt)z*=1-0.25*v.alt;}
  else if(!P.dead){tx+=(P.mvx||0)*0.3;ty+=(P.mvy||0)*0.3;}
  c.x=lerp(c.x,tx,1-Math.pow(0.02,dt));c.y=lerp(c.y,ty,1-Math.pow(0.02,dt));c.z=lerp(c.z,z,1-Math.pow(0.25,dt));
  c.s=Math.min(G.vw,G.vh)/500*c.z*(Math.max(G.vw,G.vh)>1100?1.1:1);if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);}
function step(dt){G.time+=dt;
  if(G.state==='dialog'){updateDialog(dt);return;}
  if(G.state==='dead'){G.deadT-=dt;for(const v of G.vehicles)if(v.driver&&v.ai){if(v.ai.mode==='traffic')aiTraffic(v,dt);}for(const v of G.vehicles)if(!v.sunk)vehPhys(v,dt);updateParts(dt);if(G.deadT<=0)respawn();return;}
  if(G.state!=='play')return;
  updateEnv(dt);G.fireCD-=dt;G.bustCar=0;updatePlayer(dt);
  const P=G.player;
  for(const v of G.vehicles){if(v.driver&&v.driver!==P&&v.ai){if(v.ai.mode==='traffic')aiTraffic(v,dt);else aiChase(v,dt);}
    else if(!v.driver){v.thr=0;v.str=0;}
    if(v.burn>0)v.burn-=dt;if(v.door>0)v.door-=dt;
    if(!v.dead&&!v.sunk&&v.hp<v.t.hp*0.15&&!v.t.tank){v.hp-=dt*5;if(v.hp<=0)explodeVeh(v,null);}
    const moving=Math.abs(v.vx)+Math.abs(v.vy)>0.5||v.thr!==0||v.sink;if(moving&&!v.sunk&&(hyp(v.x-P.x,v.y-P.y)<2600||(v.ai&&v.persist)))vehPhys(v,dt);}
  vehCollide();vehPedCollide();
  for(const p of G.peds)aiPed(p,dt);
  updateBullets(dt);updateParts(dt);updatePickups(dt);worldTriggers(dt);updateMission(dt);spawner(dt);plusEvents(dt);plusHeli(dt);plusAmbient(dt);cityUpdate(dt);if(G.state!=='play')return;
  {const grab=G.time-(G.bustBy||-9)<0.25&&!P.veh,sp=hyp(P.mvx||0,P.mvy||0);G.bust=clamp((G.bust||0)+(grab&&sp<70&&G.time-(G.lastPunch||-9)>0.7?dt/2.2:-dt*0.6),0,1);if(G.wanted===0)G.bust=0;if(G.bust>=1){G.bust=0;busted();}}
  if(G.boom){G.boom.t-=dt*1.8;if(G.boom.t<=0)G.boom=null;}
  if(!P.dead&&P.hp<50&&G.time-(G.lastHurt||0)>6)P.hp=Math.min(50,P.hp+4*dt);
  if(P.hp<P._lastHp)G.hurtFlash=Math.max(G.hurtFlash||0,0.6);P._lastHp=P.hp;}
let last=0;
function frame(now){const dt=Math.min(0.05,(now-last)/1000||0);last=now;
  if(G.state==='title'){G.time+=dt;G.cam.x=60*T+Math.sin(G.time*0.05)*1800;G.cam.y=70*T+Math.cos(G.time*0.04)*1500;G.cam.s=Math.min(G.vw,G.vh)/560*0.75;ENV.clock=19.4;calcLight();}
  else{G.ft=lerp(G.ft||0.016,dt,0.03);if(G.state==='play'&&!G.lowFx&&G.ft>0.028&&G.time>10){G.lowFx=1;resize();}
    step(dt);if(G.state==='map')drawMap();if(G.state!=='pause'||true)updateCamera(dt);updateHUD(dt);updateAudio();}
  render();requestAnimationFrame(frame);}
function init(){genWorld();buildMinimap();buildMissions();buildMissions2();resize();addEventListener('resize',resize);setupInput();
  G.player=mkPed('player',POI.start.x,POI.start.y);G.peds=[];
  applyLang();$('menu').style.display='flex';requestAnimationFrame(frame);
  window.__G=G;}
init();

</script>
