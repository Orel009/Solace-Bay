    const cx=clamp(x,tx*T,tx*T+T),cy=clamp(y,ty*T,ty*T+T);const dx=x-cx,dy=y-cy,d=hyp(dx,dy);

  return any?[pxp+pxn,pyp+pyn]:null;}

function vehPhys(v,dt){const t=v.t;let ca=Math.cos(v.a),sa=Math.sin(v.a);
  let vf=v.vx*ca+v.vy*sa,vr=-v.vx*sa+v.vy*ca;
  const thr=(v.dead||v.sink)?0:v.thr,str=(v.dead||v.sink)?0:v.str;
  if(thr>0){if(vf<0)vf+=t.acc*2.2*thr*dt;else vf+=t.acc*thr*dt*(1-0.55*vf/t.max);}
  else if(thr<0){if(vf>12)vf+=t.acc*2.4*thr*dt;else vf+=t.acc*0.75*thr*dt;}
  else vf-=Math.sign(vf)*Math.min(Math.abs(vf),(t.boat?40:70+Math.abs(vf)*0.35)*dt);
  vf=clamp(vf,-t.max*0.4,t.max*(v.hp<t.hp*0.5&&!t.tank?0.72+0.56*v.hp/t.hp:1));
  if(t.plane)planePhys(v,dt,vf);
  if(v.hb&&!t.boat)vf-=Math.sign(vf)*Math.min(Math.abs(vf),240*dt);
  const grip=t.grip*(v.hb?0.22:1)*(t.boat?1:1-0.42*ENV.wet);v.sm=lerp(v.sm||0,str,Math.min(1,dt*9));vr*=Math.max(0,1-grip*dt);
  const sp=Math.abs(vf),tf=clamp(vf/110,-1,1)*(1-clamp((sp-t.max*0.6)/t.max,0,0.3));
  v.a+=(v.sm*t.turn*(v.hb?1.4:1)+(v.pull||0))*tf*dt;
  if(v.driver===G.player)G.skidNow=!t.boat&&(Math.abs(vr)>105||(v.hb&&Math.abs(vf)>90));
  ca=Math.cos(v.a);sa=Math.sin(v.a);
  v.vx=ca*vf-sa*vr;v.vy=sa*vf+ca*vr;v.speed=vf;v.slide=vr;
  moveVeh(v,dt);
  if(!t.boat&&!v.sunk&&!(v.alt>0.25)&&tileAt(v.x,v.y)===TL.WATER){
    if(!v.sink){v.sink=0.001;splash(v.x,v.y,18);sfx.splash();}
  }
  if(v.sink){v.sink+=dt;v.vx*=0.92;v.vy*=0.92;if(v.sink>1.3)sinkVeh(v);}
  // skid marks
  if(!t.boat&&Math.abs(vr)>130&&!v.sink&&G.decals.length<600&&v.onScreen){const bx=v.x-ca*t.l*0.35,by=v.y-sa*t.l*0.35;
    G.decals.push({t:'skid',x:bx-sa*t.w*0.35,y:by+ca*t.w*0.35,a:v.a},{t:'skid',x:bx+sa*t.w*0.35,y:by-ca*t.w*0.35,a:v.a});}
  vehFx(v,vf,vr,dt);
  if(t.boat&&Math.abs(vf)>60&&rand()<0.7)part('wake',v.x-ca*t.l*0.5+rr(-6,6),v.y-sa*t.l*0.5+rr(-6,6),0,0,0.9,rr(5,9));
}
function moveVeh(v,dt){if(v.alt>0.25){v.x=clamp(v.x+v.vx*dt,T,(MW-1)*T);v.y=clamp(v.y+v.vy*dt,T,(MH-1)*T);return;}
 const sp=hyp(v.vx,v.vy),n=Math.max(1,Math.ceil(sp*dt/12)),sdt=dt/n;
  for(let k=0;k<n;k++){v.x+=v.vx*sdt;v.y+=v.vy*sdt;let px=0,py=0,hit=false;
    for(const c of vehCircles(v)){const p=circlePush(c[0],c[1],c[2],tt=>solidFor(v,tt));if(p){px+=p[0];py+=p[1];hit=true;}}
    if(hit){v.x+=px;v.y+=py;const l=hyp(px,py)||1,nx=px/l,ny=py/l,vn=v.vx*nx+v.vy*ny;
      if(vn<0){v.vx-=1.25*vn*nx;v.vy-=1.25*vn*ny;v.vx*=0.86;v.vy*=0.86;const imp=-vn;
        if(imp>110){damageVeh(v,(imp-110)*0.07,null,'hit');if(v.t.bike&&imp>250&&v.driver===G.player)throwRider(v,imp);addDentDir(v,-nx,-ny,imp-90);if(v.driver===G.player)sfx.crash(imp);if(imp>160)part('spark',v.x-nx*v.t.w*0.5,v.y-ny*v.t.w*0.5,rr(-60,60),rr(-60,60),0.3,3);}}}}
}

function movePed(p,dx,dy){const r=9;
  p.x+=dx;let c=circlePush(p.x,p.y,r,solidPed);if(c){p.x+=c[0];p.y+=c[1];}

function hurtPed(p,d,src,how){if(p.dead||d<=0)return;if(p===G.player&&G.armor>0&&how!=='drown'){const ab=Math.min(G.armor,d*0.8);G.armor-=ab;d-=ab;}p.hp-=d;if(p===G.player)G.lastHurt=G.time;else if(how==='punch'&&p.hp>0)p.stag=p.type==='cop'?0.7:0.28;

function updateBullets(dt){for(const b of G.bullets){const steps=Math.max(1,Math.ceil(hyp(b.vx,b.vy)*dt/10)),sdt=dt/steps;
  if(b.kind==='flame')part('fire',b.x+rr(-4,4),b.y+rr(-4,4),b.vx*0.1,b.vy*0.1,0.22,rr(5,10));
  for(let k=0;k<steps&&!b.dead;k++){b.x+=b.vx*sdt;b.y+=b.vy*sdt;const tt=tileAt(b.x,b.y);
    if(heliHit(b)||gatorHit(b)){b.dead=true;break;}
    if((tt===TL.BLD&&!(b.h&&bAt(b.x,b.y).ht<=b.h+0.2))||tt===TL.FENCE){b.dead=true;if(b.kind!=='flame')part('spark',b.x,b.y,rr(-50,50),rr(-50,50),0.2,2);if(b.expl)explodeAt(b.x,b.y,b.op);break;}
    for(const p of G.peds){if(p.dead||p.veh||p===b.op)continue;if((p.x-b.x)**2+(p.y-b.y)**2<130){hurtPed(p,b.dmg,b.op,'shot');if(b.kind==='flame')p.burn=3;b.dead=true;if(b.expl)explodeAt(b.x,b.y,b.op);break;}}
    if(b.dead)break;

    for(const v of G.vehicles){if(v===b.ov||v.sunk||v.alt>0.25)continue;if(pointInVeh(v,b.x,b.y,2)){if(!b.expl&&b.kind!=='flame')addHole(v,b.x,b.y);damageVeh(v,b.dmg*(b.expl?4.5:0.45),b.op,b.expl?'boom':'shot');vehShot(v,b);b.dead=true;part('spark',b.x,b.y,rr(-60,60),rr(-60,60),0.25,2);
      if(b.expl)explodeAt(b.x,b.y,b.op,v);break;}}}
  b.life-=dt;if(b.life<=0){b.dead=true;if(b.expl)explodeAt(b.x,b.y,b.op);}}
  for(const b of G.bullets)if(b.dead&&b.kind==='molo'&&!b.landed){b.landed=1;moloLand(b.x,b.y);}

function trafficAt(v,i,j,d,frac){const ni=i+DIRS[d][0],nj=j+DIRS[d][1];const a=exitPt(i,j,d),b=entryPt(ni,nj,d);
  v.x=lerp(a.x,b.x,frac);v.y=lerp(a.y,b.y,frac);v.a=d*Math.PI/2;
  v.ai={mode:'traffic',node:[ni,nj],d,wps:[b],blocked:0,stuck:0,rev:0,cruise:(v.t.bus?150:v.t.bike?230:190)+rr(-20,20)};}
function trafficFromHere(v){const [i,j]=nearestNode(v.x,v.y);let d=Math.round(((v.a%TAU)+TAU)%TAU/(Math.PI/2))%4;
  if(!validDir(i,j,d))d=[0,1,2,3].find(k=>validDir(i,j,k));
  v.ai={mode:'traffic',node:[i,j],d,wps:[entryPt(i,j,d)],blocked:0,stuck:0,rev:0,cruise:180};}
function pickDir(i,j,d){const opts=[];for(let k=0;k<4;k++){if(k===(d+2)%4||!validDir(i,j,k))continue;opts.push(k);if(k===d){opts.push(k);opts.push(k);}}return opts.length?pick(opts):(d+2)%4;}
function aiTraffic(v,dt){const ai=v.ai;if(!ai.wps.length){trafficFromHere(v);return;}
  let wp=ai.wps[0];const nk=ai.node[0]*100+ai.node[1];

function nextNodeToward(x,y,tx,ty){const [i,j]=nearestNode(x,y);const np=nodePos(i,j);
  if(hyp(np.x-x,np.y-y)>150)return np;let best=null,bd=1e9;
  for(let d=0;d<4;d++){if(!validDir(i,j,d))continue;const p=nodePos(i+DIRS[d][0],j+DIRS[d][1]);const dd=hyp(p.x-tx,p.y-ty);if(dd<bd){bd=dd;best=p;}}
  return best||np;}
function chaseDrive(v,tx,ty,dt){const ai=v.ai,d=hyp(tx-v.x,ty-v.y);let gx,gy;
  if(ai.mode==='chase'&&!v.mission&&d>650&&d<1600&&G.seenNow&&!onScreen(v.x,v.y,200)&&!v.t.boat){if(!ai.wp||hyp(ai.wp.x-v.x,ai.wp.y-v.y)<60)ai.wp=nextNodeToward(v.x,v.y,tx,ty);const dx=ai.wp.x-v.x,dy=ai.wp.y-v.y,dd=hyp(dx,dy)||1,sp=Math.max(v.t.max*0.82,370);
    v.a=Math.atan2(dy,dx);v.vx=dx/dd*sp;v.vy=dy/dd*sp;v.speed=sp;v.thr=1;v.str=0;v.hb=0;ai.stuck=0;ai.rev=0;return d;}
  if(d<420&&los(v.x,v.y,tx,ty)){gx=tx;gy=ty;ai.wp=null;}
  else{if(!ai.wp||hyp(ai.wp.x-v.x,ai.wp.y-v.y)<80)ai.wp=nextNodeToward(v.x,v.y,tx,ty);gx=ai.wp.x;gy=ai.wp.y;}
  if(ai.rev>0){ai.rev-=dt;v.thr=-1;v.str=ai.revDir;v.hb=0;return d;}
  let diff=angDiff(v.a,Math.atan2(gy-v.y,gx-v.x));
  const look=46+Math.abs(v.speed)*0.32,ca=Math.cos(v.a),sa=Math.sin(v.a);
  if(solidFor(v,tileAt(v.x+ca*look,v.y+sa*look))){
    const l=solidFor(v,tileAt(v.x+Math.cos(v.a-0.7)*look,v.y+Math.sin(v.a-0.7)*look)),r=solidFor(v,tileAt(v.x+Math.cos(v.a+0.7)*look,v.y+Math.sin(v.a+0.7)*look));
    if(!l&&r)diff=-1.2;else if(l&&!r)diff=1.2;}

function aiChase(v,dt){const ai=v.ai,P=G.player,tgt=P.veh||P,law=ai.faction==='police'||ai.faction==='army';if(ai.wait>0){ai.wait-=dt;v.thr=0;v.hb=1;return;}if(ai.faction==='police')v.siren=G.wanted>0;

  const seen=!law||v.mission||G.seenNow||!G.lastSeen;let tx=tgt.x,ty=tgt.y;{const d0=hyp(tgt.x-v.x,tgt.y-v.y);if(P.veh&&d0>180&&d0<900){const k=clamp(d0/600,0.2,0.8);tx+=P.veh.vx*k;ty+=P.veh.vy*k;}}
  if(!seen){const ls=G.lastSeen;if(ai.sp||hyp(v.x-ls.x,v.y-ls.y)<300){ai.spT=(ai.spT||0)-dt;
      if(!ai.sp||ai.spT<=0||hyp(v.x-ai.sp.x,v.y-ai.sp.y)<150){const [i,j]=nearestNode(ls.x,ls.y);ai.sp=nodePos(clamp(i+ri(-2,2),0,XS.length-1),clamp(j+ri(-2,2),0,YS.length-1));ai.spT=7;}
      tx=ai.sp.x;ty=ai.sp.y;}else{tx=ls.x;ty=ls.y;}}
  else ai.sp=null;
  chaseDrive(v,tx,ty,dt);if(!seen){if(v.speed>190)v.thr=0;ai.bust=0;return;}
  const d=hyp(tgt.x-v.x,tgt.y-v.y);

    fire(null,v,v.x,v.y,Math.atan2(tgt.y-v.y,tgt.x-v.x),ai.faction==='army'?16:10,0.12);}}
function unload(v){const ai=v.ai;const n=v.occ;v.occ=0;

    const type=ai.faction==='police'?'cop':ai.faction==='army'?'soldier':'gang';

function aiPed(p,dt){if(p.dead||p.veh||p.medicP)return;
  if(p.burn>0){p.burn-=dt;hurtPed(p,16*dt,null,'burn');if(rand()<0.5)part('fire',p.x+rr(-5,5),p.y+rr(-5,5),0,-20,0.4,rr(4,7));if(p.dead)return;}

  if(p.swim){if(!p.inWater)p.inWater=0;p.inWater+=dt;if(p.inWater>14)hurtPed(p,8*dt,null,'drown');}else p.inWater=0;
  if(p.sayT>0)p.sayT-=dt;
  p.cool-=dt;
  if(p.stun>0){p.stun-=dt;p.walk=0;return;}
  if(p.car&&p.type==='cop'&&copReturn(p,dt))return;
  if(p.brawl>0&&plusBrawl(p,dt))return;
  if(p.prey&&plusPrey(p,dt))return;
  if(p.war&&!p.hostile&&plusWar(p,dt))return;
  const hostile=p.type==='cop'?G.wanted>0:p.type==='soldier'?(p.hostile||G.inBase):(p.hostile&&p.type==='gang');
  if(hostile&&!G.player.dead){aiHostile(p,dt);return;}
  if(p.type==='soldier'){p.walk=0;const P=G.player;if(hyp(P.x-p.x,P.y-p.y)<300)p.a=Math.atan2(P.y-p.y,P.x-p.x);return;}
  if(p.type==='npc')return;
  aiCiv(p,dt);}
function walkDir(p,sp,dt){const s=p.swim?sp*0.45:sp;movePed(p,Math.cos(p.a)*s*dt,Math.sin(p.a)*s*dt);p.walk+=s*dt;}

    else{if(p.kind==='tourist'&&rand()<0.3){p.st='idle';part('flash',p.x+Math.cos(p.a)*12,p.y+Math.sin(p.a)*12,0,0,0.1,9);return;}
      if(G.rep<-15&&rand()<0.2&&hyp(p.x-G.player.x,p.y-G.player.y)<140){p.st='flee';p.ft=3;p.fx=G.player.x;p.fy=G.player.y;react(p,'psycho');return;}
      if(rand()<0.16&&!(p.chatT>G.time))for(const o of G.peds){if(o===p||o.type!=='civ'||o.dead||o.kind==='dog'||o.chatT>G.time||(o.st!=='walk'&&o.st!=='idle')||hyp(o.x-p.x,o.y-p.y)>64)continue;p.st=o.st='chat';p.ft=o.ft=rr(5,9);p.mate=o;o.mate=p;p.ct=0.3;o.ct=1.9;return;}}

function aiHostile(p,dt){const P=G.player,tgt=P.veh||P,d=hyp(tgt.x-p.x,tgt.y-p.y);

function spawner(dt){G.spawnT-=dt;if(G.spawnT>0)return;G.spawnT=0.3;const P=G.player,cx=P.x,cy=P.y;
  for(const v of G.vehicles){if(v.persist||v.parked||v.driver===P||v===P.lastVeh)continue;const d=hyp(v.x-cx,v.y-cy);if(d>2400||(v.dead&&d>1300&&!v.onScreen))v.remove=true;}
  for(const p of G.peds){if(p.persist||p===P)continue;const d=hyp(p.x-cx,p.y-cy);if(d>1800||(p.dead&&d>900&&!onScreen(p.x,p.y,60)))p.remove=true;}
  let traffic=0,chasers={police:0,army:0},civs=0;
  for(const v of G.vehicles)if(!v.remove&&v.ai){if(v.ai.mode==='traffic')traffic++;else if(v.ai.mode==='chase'&&chasers[v.ai.faction]!=null)chasers[v.ai.faction]++;}
  for(const p of G.peds)if(!p.remove&&!p.dead&&p.type!=='soldier'&&p!==P)civs++;
  const nk=1-0.45*ENV.dark-0.2*ENV.rain;
  if(traffic<17*nk)spawnTraffic(cx,cy);
  if(civs<30*nk)spawnCiv(cx,cy);
  const wantCars=[0,1,2,3,3,4,4][G.wanted],wantArmy=G.wanted>=6?3:G.wanted>=5?2:0;
  if(chasers.police<wantCars&&!P.dead)spawnChaser('police','police',null,850,1500);

  if(side===2)l={gx:pos,gy:y1+15,rx:pos,ry:y1-17,wx:pos,wy:y1};else if(side===0)l={gx:pos,gy:y0-15,rx:pos,ry:y0+17,wx:pos,wy:y0};

  const ds=v.dents||(v.dents=[]);ds.push({x:lx+rr(-3,3),y:ly+rr(-3,3),r:clamp(4+sev*0.07,4,13),s:rand()});if(ds.length>9)ds.shift();

function drawDamage(v){const t=v.t,Lh=t.l/2,Wh=t.w/2,dm=1-v.hp/t.hp,car=!t.boat&&!t.bike&&!t.tank;if(!v.dents&&!v.holes&&dm<0.45)return;
  g.save();rrect(g,-Lh,-Wh,t.l,t.w,7);g.clip();
  if(v.dents)for(const dn of v.dents){g.fillStyle='rgba(0,0,0,0.42)';g.beginPath();for(let k=0;k<7;k++){const a=k*TAU/7,r=dn.r*(0.65+((dn.s*(k+1)*7.3)%1)*0.6);g.lineTo(dn.x+Math.cos(a)*r,dn.y+Math.sin(a)*r);}g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,0.24)';g.lineWidth=1;g.beginPath();g.moveTo(dn.x-dn.r*0.6,dn.y-dn.r*0.2);g.lineTo(dn.x+dn.r*0.5,dn.y+dn.r*0.4);g.moveTo(dn.x-dn.r*0.2,dn.y+dn.r*0.6);g.lineTo(dn.x+dn.r*0.7,dn.y-dn.r*0.3);g.stroke();}
  if(v.holes){g.fillStyle='#0a0a0a';for(const h of v.holes){g.beginPath();g.arc(h.x,h.y,1.7,0,TAU);g.fill();}}
  if(car&&dm>0.4){const fx=Lh*0.24+6;g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=0.8;g.beginPath();for(let k=0;k<5;k++){g.moveTo(fx,-2);g.lineTo(fx+Math.cos(k*1.3)*6,-2+Math.sin(k*1.3)*(Wh-4));}g.stroke();}
  if(car&&dm>0.68){g.fillStyle='rgba(0,0,0,0.5)';g.fillRect(Lh*0.5,-Wh+3,Lh*0.42,t.w-6);}
  g.fillStyle='#161616';if(v.hlB&1)g.fillRect(Lh-4,-Wh+2,5,8);if(v.hlB&2)g.fillRect(Lh-4,Wh-10,5,8);if(v.tlB&1)g.fillRect(-Lh-1,-Wh+2,5,8);if(v.tlB&2)g.fillRect(-Lh-1,Wh-10,5,8);
  g.restore();}

  G.ambT=(G.ambT===undefined?45:G.ambT)-dt;if(G.ambT<=0){G.ambT=rr(60,100);post('amb');}
  propsUpdate(dt);sprayUpdate(dt);
  for(const s of SHOPS){const d=hyp(px-s.sx,py-s.sy),hm=s.k==='home',sale=hm&&!owned(s.pid),locked=hm?sale||(G.wanted>0&&G.seenNow):G.wanted>0||s.cd>G.time,can=!P.veh&&!P.roof&&!P.climb&&!P.inside;
    s.open=appr(s.open,can&&d<70&&!locked?1:0,dt*3.2);
    if(G.inShop===s){if(d>46)G.inShop=null;continue;}
    if(can&&Math.abs(px-s.x)<15&&Math.abs(py-(s.wy+s.out*10))<7){if(locked){if(!s.told||G.time-s.told>4){s.told=G.time;if(!sale)toast(tr(hm?'homeSeen':s.cd>G.time?'closedRob':'locked'));}}else if(s.open>0.85){enterRoom(s);return;}}}
  // gas stations
  const v=P.veh;if(v&&!v.t.boat&&!v.t.tank&&Math.abs(v.speed)<25)for(const gs of GAS){if(hyp(v.x-gs.x,v.y-gs.y)>55)continue;const need=v.fuel<0.995||v.hp<v.t.hp-1||v.dents;
    if(need&&(G.money>0||owned('b_gas'))){v.fuel=Math.min(1,v.fuel+dt*0.3);v.hp=Math.min(v.t.hp,v.hp+dt*v.t.hp*0.2);v.dry=0;G.gasAcc=(G.gasAcc||0)+dt*14;if(G.gasAcc>=1){G.gasAcc-=1;if(!owned('b_gas'))G.money--;}
      if(v.hp>=v.t.hp-1&&v.dents){repairVeh(v);sfx.blip();}if(!gs.told||G.time-gs.told>6){gs.told=G.time;toast(tr('fueling'),2.5);}}}
  // alligators
  for(const ga of G.gators){if(ga.dead)continue;ga.cool-=dt;ga.ph+=dt;const d=hyp(px-ga.x,py-ga.y),hunt=P.swim&&!P.veh&&!P.dead&&d<270;let tx,ty,sp;
    if(hunt){tx=px;ty=py;sp=118;}else{tx=ga.hx+Math.cos(ga.ph*0.25)*120;ty=ga.hy+Math.sin(ga.ph*0.19)*120;sp=26;}
    const a=Math.atan2(ty-ga.y,tx-ga.x);ga.a+=angDiff(ga.a,a)*Math.min(1,dt*3);const nx=ga.x+Math.cos(ga.a)*sp*dt,ny=ga.y+Math.sin(ga.a)*sp*dt;if(tileAt(nx,ny)===TL.WATER){ga.x=nx;ga.y=ny;}
    if(hunt&&d<24&&ga.cool<=0){ga.cool=1.2;hurtPed(P,16,null,'bite');G.hurtFlash=0.8;splash(px,py,10);sfx.punch();post('gator');}}
  for(const f of G.flam)f.fly=appr(f.fly,hyp(px-f.x,py-f.y)<140?1:0,dt*(f.fly>0&&hyp(px-f.x,py-f.y)>=140?0.25:2.2));
  // talk menu timeout
  if(G.talk){G.talk.t-=dt;if(G.talk.t<=0||G.talk.p.dead||hyp(G.talk.p.x-px,G.talk.p.y-py)>110||P.veh){G.talk=null;buildTalk();}}
  if(G.wanted===0)G.heat=Math.max(0,Math.min(G.heat||0,0.95)-dt*0.04);}

function buildInsideBar(){const el=$('ibar'),P=G.player,s=P&&P.inside;if(!s||G.state==='shop'){el.style.display='none';return;}el.style.display='flex';el.innerHTML='';el.dir=G.lang==='he'?'rtl':'ltr';

  if(G.rob&&G.rob.s===s){const lb=document.createElement('div');lb.className='wchip robinfo';lb.textContent=tr('robbingBar');el.appendChild(lb);return;}
  if(s.bag){const lb=document.createElement('div');lb.className='wchip robinfo';lb.textContent=tr('bagBar');el.appendChild(lb);}
  if(s.k==='home'){add(tr('saveSleep'),homeSleep,'go');add(tr('wardrobe'),()=>openShop(s,'wardrobe'));add(tr('laptop'),()=>openShop(s,'laptop'));}
  else{if(s.cd>G.time){}else if(s.k==='guns')add(tr('buyW'),()=>openShop(s,'guns'),'go');else if(s.k==='market')add(tr('shopBuy'),()=>openShop(s,'food'),'go');else if(s.k==='clothes')add(tr('clothesB'),()=>openShop(s,'clothes'),'go');
    else if(s.k==='mall'){add(tr('foodB'),()=>openShop(s,'food'),'go');add(tr('clothesB'),()=>openShop(s,'clothes'),'go');}else if(s.k==='casino')add(tr('slots'),()=>openShop(s,'slots'),'go');

function insideRob(){const P=G.player,s=P.inside;if(!s||!s.rob)return;if(G.weapon==='fist'){const w=['rifle','smg','shotgun','pistol','rocket','flame'].find(k=>G.weapons[k]>0);if(!w){toast(tr('robNeed'),3);sfx.no();return;}G.weapon=w;}G.fireCD=0;insideAttack();buildInsideBar();}

function custUpdate(s,dt){for(const c of s.cust||[]){if(c.dead||c.st==='cower')continue;c.tm=(c.tm||0)-dt;if(!c.tg||c.tm<=0){c.tm=rr(2,6);let u,v,n=0;do{u=rr(-s.W/2+26,s.W/2-26);v=rr(30,s.D-96);}while(++n<16&&!roomFree(s,u,v));c.tg=rw(s,u,v);c.idle=rand()<0.4;}
    const dx=c.tg[0]-c.x,dy=c.tg[1]-c.y,d=hyp(dx,dy);if(c.idle||d<4){c.walk=0;continue;}const u2=c.x+dx/d*34*dt-s.x,v2=(s.wy-(c.y+dy/d*34*dt))*s.out;if(!roomFree(s,u2,v2)){c.tm=0;continue;}c.a=Math.atan2(dy,dx);c.x+=dx/d*34*dt;c.y+=dy/d*34*dt;c.walk+=34*dt;}}

function damageVeh(v,d,src,how){if(v.dead||d<=0)return;const mx=v.t.hp;
  if(how==='hit'){if(G.time<(v.hitT||0))return;v.hitT=G.time+0.3;d=Math.min(d,mx*0.2);}
  if(src===G.player&&v.t.police)crime(1,true);
  if(how==='boom'){v.hp-=d;if(v.hp<=0){v.hp=0;explodeVeh(v,src);}return;}
  v.hp=Math.max(1,v.hp-d);if(v.hp<=mx*0.12&&!v.t.tank&&!v.fuse)startFuse(v,src);}
function startFuse(v,src){v.fuse=v.driver===G.player?8:5.5;v.fuseSrc=src||null;
  if(v.driver===G.player){toast(tr('carFire'),3.5);sfx.no();}else if(v.driver&&v.ai&&!v.mission)bailOut(v);}
function fuseTick(v,dt){if(v.hp>v.t.hp*0.3){v.fuse=0;return;}v.fuse-=dt;
  if(v.onScreen!==false&&rand()<dt*26){const ca=Math.cos(v.a),sa=Math.sin(v.a),f=v.t.l*0.32;part('fire',v.x+ca*f+rr(-7,7),v.y+sa*f+rr(-7,7),rr(-20,20),rr(-50,-10),rr(0.3,0.6),rr(5,10));if(rand()<0.5)part('smoke',v.x+ca*f,v.y+sa*f,rr(-20,20),rr(-60,-20),rr(0.8,1.5),rr(8,14));}
  if(v.fuse<=0){v.fuse=0;explodeVeh(v,v.fuseSrc);}}
function bailOut(v){if(!v.driver||v.driver===G.player)return null;const kind=v.driver,ai=v.ai,P=G.player,ca=Math.cos(v.a),sa=Math.sin(v.a);
  if(ai&&ai.mode==='chase'){unload(v);v.thr=0;v.hb=1;return null;}
  let x=v.x+sa*(v.t.w*0.5+14),y=v.y-ca*(v.t.w*0.5+14);if(solidPed(tileAt(x,y))){x=v.x-sa*(v.t.w*0.5+14);y=v.y+ca*(v.t.w*0.5+14);}if(solidPed(tileAt(x,y))){x=v.x;y=v.y;}

const STUNTS=[];
function genStunts(){const R=mulberry32(5150);let tries=0;while(STUNTS.length<14&&tries++<600){const i=Math.floor(R()*XS.length),j=Math.floor(R()*YS.length),dir=Math.floor(R()*4);if(!validDir(i,j,dir))continue;

  STUNTS.push({x,y,a:dir*Math.PI/2,id:STUNTS.length});}}

  if(v&&v.airT>0){v.airT-=dt;v.vx=v.airV[0];v.vy=v.airV[1];v.a=v.airA;v.str=0;if(v.airT<=0){v.airT=0;sfx.crash(260);G.shake=Math.max(G.shake||0,5);part('dust',v.x,v.y,0,0,0.7,14);
      const m=Math.round(v.airD/T*4),pay=Math.round(m*8);if(v.airS<330){toast(tr('stuntLow'),2);return;}let bonus=pay;const k='st'+v.airId;if(!G.got.includes(k)){G.got.push(k);bonus+=500;toast(fmt(tr('stuntNew'),G.got.filter(x=>x.startsWith('st')).length,STUNTS.length,bonus),3.5);sfx.pass();}else toast(fmt(tr('stunt'),m,bonus),2.5);G.money+=bonus;}return;}
